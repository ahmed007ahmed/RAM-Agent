<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>RAM | إنجاز القابضة</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a28;--panel2:#172337;--line:#253247;--text:#f3f6fc;--muted:#9ba9bc;--green:#26d27b;--blue:#73a9ff;--red:#ff7777;--gold:#f4c75e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:2;background:#080d18ed;border-bottom:1px solid var(--line);padding:14px 16px 10px;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);color:#06150d;font-size:23px;font-weight:900;display:grid;place-items:center}.brand b{font-size:20px}.brand small{display:block;color:var(--green);font-size:12px}.flow{font-size:12px;color:var(--muted);margin:10px 0 0;white-space:nowrap;overflow:auto}.tabs{display:flex;gap:8px;overflow:auto;padding:11px 0 2px;scrollbar-width:none}.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:20px;padding:9px 13px;font:inherit}.tabs button.active{background:#193a2d;color:#b8f5d3;border-color:#28774f}main{padding:16px;max-width:900px;margin:auto;padding-bottom:34px}h1{font-size:22px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 10px}.muted,small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:11px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:76px}.stat b{display:block;font-size:22px;margin-top:4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer}button.primary{background:#16864c;border-color:#22945c;color:white;font-weight:700}button.danger{color:#ffaaaa}.badge{display:inline-block;border-radius:20px;background:#273449;color:#d2e0f6;padding:4px 9px;font-size:12px}.money{color:#b8f5d3;font-weight:650}.field{display:block;margin:11px 0;color:#cbd5e3}.field input,.field select,.field textarea,input,textarea,select{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;margin-top:5px}.field textarea,textarea{min-height:82px;resize:vertical}.empty{text-align:center;color:var(--muted);padding:22px 10px}.event{border-right:2px solid #42618e;padding:4px 10px;margin:8px 0}.chat{white-space:pre-wrap;line-height:1.6}.user{border-color:#286246;background:#10251f}#toast{display:none;position:fixed;bottom:18px;left:14px;right:14px;z-index:9;background:#24334a;border:1px solid #526b8b;border-radius:12px;padding:13px;box-shadow:0 6px 28px #0009}dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--text);width:min(92vw,520px);max-height:88vh;overflow:auto}dialog::backdrop{background:#0009}footer{color:var(--muted);text-align:center;font-size:12px;padding:18px}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">R</div><div><b>RAM</b><small>شريك الأعمال · إنجاز القابضة</small></div><button id="settingsQuick" style="margin-right:auto">⚙</button></div><div class="flow">فرصة ← اختيارك ← تنفيذ ← تسليم ← متابعة ← مستحق</div><nav class="tabs" id="nav"></nav></header>
<main id="main"></main><div id="toast" role="status"></div><dialog id="modal"></dialog><footer>سجل الأعمال محفوظ على هذا الهاتف. لا يرسل التطبيق عروضًا أو أموالًا تلقائيًا.</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), labels={NEW:'فرصة محفوظة',SELECTED:'مختارة بانتظار الاتفاق',IN_PROGRESS:'قيد التنفيذ',DELIVERED:'تم التسليم',PAYMENT_PENDING:'مستحق بانتظار الدفع',PAYMENT_REPORTED:'العميل أفاد بالتحويل',RECEIVED:'تم استلام المبلغ'}, stages=['NEW','SELECTED','IN_PROGRESS','DELIVERED','PAYMENT_PENDING','PAYMENT_REPORTED','RECEIVED'];
const tabs={home:'الرئيسية',opportunities:'الفرص',active:'الأعمال الجارية',delivered:'المنجزة',dues:'المستحقات',contacts:'الشركات والموردون',legal:'المتابعة القانونية',chat:'المحادثة',settings:'الإعدادات'};let tab='home',state={version:1,jobs:[],contacts:[],messages:[],settings:{}},busy=false,results=[];
try{const x=JSON.parse(window.Android?.load?.()||'null');if(x&&x.version===1&&Array.isArray(x.jobs)&&Array.isArray(x.contacts))state={...state,...x};}catch(e){}
function save(){try{if(window.Android?.save&&!Android.save(JSON.stringify(state)))throw Error('تعذر حفظ السجل على الهاتف');}catch(e){throw Error(e.message||'تعذر حفظ السجل');}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function btn(text,fn,cls=''){const b=el('button',text,cls);b.type='button';b.onclick=()=>{try{fn()}catch(e){toast(e.message)}};return b}
function card(parent,title){const d=el('section',undefined,'card');if(title)d.append(el('h2',title));parent.append(d);return d}
function formField(f,key,label,type='text',value=''){const l=el('label',label,'field');let i;if(Array.isArray(type)){i=el('select');for(const [v,t]of type){const o=el('option',t);o.value=v;i.append(o)}}else{i=el(type==='textarea'?'textarea':'input');if(type!=='textarea')i.type=type}i.name=key;if(value!=null)i.value=value;l.append(i);f.append(l);return i}
function modal(title,fields,submit){const d=$('modal');d.replaceChildren(el('h2',title));const f=el('form');d.append(f);for(const x of fields)formField(f,...x);f.append(btn('حفظ',()=>{},'primary'));const close=btn('إغلاق',()=>d.close());f.append(close);f.onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(f)));d.close();render()}catch(err){toast(err.message)}};d.showModal()}
const categories=[['TRANSLATION','الترجمة والكتابة'],['ENGINEERING','الهندسة والتصميم'],['TECH','المواقع والبرمجة'],['RESEARCH','الأبحاث والتطوير'],['LOGISTICS','الشحن واللوجستيات'],['SOURCING','التوريد والوساطة'],['PROPERTY','العقارات والسياحة'],['OTHER','أخرى']],currencies=['USD','USDT','YER','SAR','AED','EUR','GBP'].map(x=>[x,x]);
function fmt(j){return j.amount==null||j.amount===''?'المبلغ غير محدد':(Number(j.amount)/100).toLocaleString('ar',{maximumFractionDigits:2})+' '+(j.currency||'USD')}
function moneyInput(v){if(v==null||v==='')return null;const n=Math.round(Number(v)*100);if(!Number.isSafeInteger(n)||n<0)throw Error('تحقق من قيمة المبلغ');return n}
function validUrl(s){try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}}
function addJob(seed={}){modal('إضافة فرصة أو عمل',[['title','عنوان العمل','text',seed.title||''],['category','المجال',categories,seed.category||'OTHER'],['source','رابط المصدر أو الاتفاق','url',seed.url||''],['client','الشركة أو العميل','text',seed.client||''],['details','المطلوب والاتفاق والمخرجات','textarea',seed.details||seed.snippet||''],['amount','المبلغ المتفق أو المعلن (اختياري)','number',seed.amount||''],['currency','العملة',currencies,seed.currency||'USD'],['deadline','موعد التسليم','date','']],v=>{if(!v.title.trim()||!v.details.trim())throw Error('أدخل العنوان والتفاصيل');if(v.source&&!validUrl(v.source))throw Error('رابط المصدر غير صالح');if(state.jobs.some(j=>j.title===v.title&&j.source===v.source))throw Error('هذا العمل مسجل مسبقًا');const amount=moneyInput(v.amount);state.jobs.unshift({id:Android?.newId?.()||String(Date.now()),...v,amount,stage:'NEW',createdAt:Date.now(),events:[{at:Date.now(),note:'أُضيف يدويًا للمراجعة؛ ليس عقدًا مؤكدًا'}]});save()})}
function advance(j,to){const desc={SELECTED:'اختر هذه الفرصة؟ الاختيار لا يعني أن العميل وافق أو أن عقدًا أُبرم.',IN_PROGRESS:'سجّل الاتفاق ونطاق العمل قبل بدء التنفيذ.',DELIVERED:'سجّل رابط أو مرجع التسليم الذي أرسلته فعلًا.',PAYMENT_PENDING:'سجّل موعد استحقاق المبلغ وفق الاتفاق.',PAYMENT_REPORTED:'سجّل إشعار التحويل الذي أبلغك به العميل.',RECEIVED:'أكد الاستلام بعد التحقق من وصول المال فعلًا.'};const fields={SELECTED:[],IN_PROGRESS:[['note','نطاق الاتفاق ومخرجات العمل','textarea']],DELIVERED:[['note','مرجع رابط/رسالة التسليم الفعلي','textarea']],PAYMENT_PENDING:[['dueAt','موعد استحقاق الدفع','date']],PAYMENT_REPORTED:[['note','مرجع إشعار التحويل','textarea']],RECEIVED:[['amount','المبلغ المستلم فعليًا','number'],['currency','عملة الاستلام',currencies],['method','وسيلة الاستلام',[['BANK','حوالة بنكية'],['WESTERN_UNION','Western Union'],['MONEYGRAM','MoneyGram'],['USDT','USDT']]],['note','مرجع الاستلام (اختياري)','text']]};if(!confirm(desc[to]))return;const fs=fields[to]||[];modal(labels[to],fs,v=>{if(to==='IN_PROGRESS'&&!v.note.trim())throw Error('سجّل نطاق الاتفاق أولًا');if(to==='DELIVERED'&&!v.note.trim())throw Error('أدخل مرجع التسليم الفعلي');if(to==='PAYMENT_PENDING'&&!v.dueAt)throw Error('حدد موعد الاستحقاق');if(to==='RECEIVED'){const amount=moneyInput(v.amount);if(amount==null)throw Error('أدخل المبلغ الذي وصل فعلًا');j.receipt={amount,currency:v.currency,method:v.method,note:v.note,confirmedAt:Date.now()};j.amount=amount;j.currency=v.currency;}j.stage=to;j.events.push({at:Date.now(),stage:to,note:v.note||'تأكيد من المستخدم'});if(v.dueAt)j.dueAt=v.dueAt;save()})}
function jobCard(parent,j){const d=card(parent,j.title);d.append(el('span',labels[j.stage]||j.stage,'badge'),el('p',fmt(j),'money'));if(j.client)d.append(el('p',j.client));d.append(el('p',j.details));if(j.source){const a=el('a','فتح المصدر');a.href=j.source;a.target='_blank';a.rel='noopener';a.style.color='var(--blue)';d.append(a)}if(j.deadline)d.append(el('p','التسليم: '+j.deadline,'muted'));if(j.dueAt)d.append(el('p','الاستحقاق: '+j.dueAt,'muted'));if(j.stage==='RECEIVED'&&j.receipt)d.append(el('p',`استلام مؤكد: ${fmt(j)} · ${j.receipt.method||''}`,'money'));const row=el('div',undefined,'row');d.append(row);if(j.stage!=='RECEIVED'){const n=stages[stages.indexOf(j.stage)+1];if(n)row.append(btn(({SELECTED:'اختيار',IN_PROGRESS:'بدء التنفيذ',DELIVERED:'تسجيل التسليم',PAYMENT_PENDING:'تسجيل المستحق',PAYMENT_REPORTED:'تسجيل إشعار تحويل',RECEIVED:'تأكيد الاستلام'})[n],()=>advance(j,n),'primary'));row.append(btn('متابعة',()=>modal('تسجيل متابعة',[['note','ما الذي حدث أو ما الخطوة القادمة؟','textarea']],v=>{if(!v.note.trim())throw Error('اكتب ملاحظة المتابعة');j.events.push({at:Date.now(),note:v.note});save()})))}row.append(btn('السجل',()=>{const lines=(j.events||[]).map(e=>new Date(e.at).toLocaleString('ar')+' — '+(e.note||labels[e.stage]||'تحديث')).join('\n');alert(lines||'لا توجد تحديثات')}));if(j.stage!=='RECEIVED')row.append(btn('حذف',()=>{if(confirm('حذف هذا السجل؟')){state.jobs=state.jobs.filter(x=>x.id!==j.id);save();render()}},'danger'))}
function summary(main){main.append(el('h1','مرحبًا بك في RAM'));main.append(el('p','سجّل الفرص والأعمال ومراحل التسليم والمستحقات من مكان واحد. اختيار الفرصة أو تحديث حالتها لا يرسل رسالة للعميل تلقائيًا.','muted'));const counts=[['أعمال جارية',state.jobs.filter(j=>['SELECTED','IN_PROGRESS','DELIVERED','PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage)).length,'active'],['منجزة',state.jobs.filter(j=>j.stage==='RECEIVED').length,'delivered'],['مستحقات بانتظار الدفع',state.jobs.filter(j=>['PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage)).length,'dues'],['فرص محفوظة',state.jobs.filter(j=>j.stage==='NEW').length,'opportunities']];const g=el('div',undefined,'grid');for(const [t,n,k]of counts){const b=btn(t+'\n'+n,()=>go(k),'stat');g.append(b)}main.append(g);main.append(btn('＋ إضافة فرصة أو عمل',()=>addJob(),'primary'));const d=card(main,'آخر الأعمال');const recent=state.jobs.slice(0,3);if(!recent.length)d.append(el('p','لا توجد سجلات بعد. أضف فرصة موثقة من مصدرها.','empty'));recent.forEach(j=>jobCard(d,j));}
function renderJobs(main,filter){const list=state.jobs.filter(filter);main.append(btn('＋ إضافة فرصة أو عمل',()=>addJob(),'primary'));if(!list.length)main.append(el('p','لا توجد سجلات في هذا القسم.','empty'));list.forEach(j=>jobCard(main,j))}
function opportunities(main){main.append(el('p','أدخل فرصًا من مصدرها وتحقق من الرسوم والشروط بنفسك. البحث يطلب نتائج من الخادم إن كان متصلًا.','muted'));const f=el('form');formField(f,'category','المجال',[['','كل المجالات'],...categories]);const q=formField(f,'query','عبارة البحث','text','');q.required=true;f.append(btn('بحث الويب',()=>{},'primary'));f.onsubmit=e=>{e.preventDefault();if(!Android?.search){toast('ميزة البحث غير متاحة في هذا الإصدار');return}Android.search(f.elements.query.value.trim());toast('أُرسل طلب البحث إلى الخادم')};main.append(f);main.append(btn('＋ حفظ فرصة يدويًا',()=>addJob(),'primary'));if(results.length){const res=card(main,'نتائج البحث');results.forEach(r=>{const c=card(res,r.title||'نتيجة');c.append(el('p',r.snippet||''));if(r.url){const a=el('a','فتح المصدر');a.href=r.url;a.target='_blank';a.rel='noopener';c.append(a)}c.append(btn('حفظها',()=>addJob({title:r.title,url:r.url,snippet:r.snippet})))});}renderJobs(main,j=>j.stage==='NEW')}
function contacts(main){main.append(el('p','أضف بيانات جهات عامة تحققت منها.','muted'));main.append(btn('＋ إضافة جهة',()=>modal('إضافة شركة أو جهة',[['name','اسم الجهة','text'],['kind','التصنيف',[['COMPANY','شركة'],['SUPPLIER','مورد'],['BUYER','مشتري'],['CLIENT','عميل'],['CARRIER','ناقل']],],['source','رابط مصدر عام','url'],['email','البريد المعلن','email'],['phone','هاتف العمل المعلن','tel'],['notes','الخدمات والملاحظات','textarea']],v=>{if(!v.name.trim())throw Error('اكتب اسم الجهة');if(v.source&&!validUrl(v.source))throw Error('رابط المصدر غير صالح');state.contacts.unshift({...v,id:Android?.newId?.()||String(Date.now())});save()}),'primary'));if(!state.contacts.length)main.append(el('p','لا توجد جهات محفوظة.','empty'));state.contacts.forEach(c=>{const d=card(main,c.name);d.append(el('p',[c.kind,c.email,c.phone].filter(Boolean).join(' · ')),el('p',c.notes||''));if(c.source){const a=el('a','المصدر');a.href=c.source;a.target='_blank';a.rel='noopener';d.append(a)}})}
function dues(main){const pending=state.jobs.filter(j=>['PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage));const c=card(main,'المبالغ المسجلة بانتظار التحقق');const by={};for(const j of pending){const k=j.currency||'USD';by[k]=(by[k]||0)+(Number(j.amount)||0)}if(!pending.length)c.append(el('p','لا توجد مستحقات مسجلة.','empty'));for(const [k,v]of Object.entries(by))c.append(el('p',(v/100).toLocaleString('ar')+' '+k,'money'));main.append(el('p','إشعار التحويل لا يعني أن المال وصل. سجّل الاستلام بعد التحقق بنفسك.','muted'));renderJobs(main,j=>['PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage))}
function legal(main){main.append(el('p','قائمة مراجعة يدوية للأعمال المتأخرة. لا يرسل التطبيق بلاغًا أو يبدأ تحكيمًا تلقائيًا.','muted'));const items=state.jobs.filter(j=>j.legalOpen||(['PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage)&&j.dueAt&&new Date(j.dueAt)<new Date()));if(!items.length)main.append(el('p','لا توجد ملفات تتطلب مراجعة.','empty'));items.forEach(j=>jobCard(main,j));}
function chat(main){main.append(el('p','تحتاج المحادثة إلى اتصال الخادم. لا ترسل رسائل أو بريدًا خارج التطبيق دون مراجعتك.','muted'));const box=el('div');for(const m of state.messages.slice(-30)){const c=card(box,m.role==='user'?'أنت':'RAM');c.append(el('p',m.content,'chat'))}main.append(box);const f=el('form');const input=formField(f,'message','رسالتك إلى RAM','textarea');input.id='message';input.required=true;f.append(btn(busy?'جارٍ الرد…':'إرسال',()=>{},'primary'));f.onsubmit=e=>{e.preventDefault();if(busy)return;const message=input.value.trim();if(!message)return;state.messages.push({role:'user',content:message});save();busy=true;render();try{Android.chat(JSON.stringify({message,history:state.messages.slice(-20,-1)}))}catch(err){busy=false;toast('المحادثة غير متاحة');render()}};main.append(f);main.append(btn('🎙️ إملاء',()=>Android?.dictate?.()),btn('إيقاف الصوت',()=>Android?.stopVoice?.()))}
window.reply=data=>{busy=false;if(data?.error)state.messages.push({role:'assistant',content:'تعذر الرد: '+data.error});else{state.messages.push({role:'assistant',content:String(data?.reply||data?.response||'لم يصل رد نصي')});results=Array.isArray(data?.results)?data.results:[]}save();if(tab==='chat')render()};window.searchReply=data=>{results=Array.isArray(data?.results)?data.results:[];if(data?.answer)state.messages.push({role:'assistant',content:data.answer});if(tab==='opportunities')render();else{tab='opportunities';render()}};window.capabilitiesReply=()=>{};
function settings(main){const d=card(main,'اتصال الخادم');d.append(el('p','أدخل عنوان HTTPS للخادم الذي تملكه. لا تضع كلمات مرور أو مفاتيح API هنا.','muted'));const f=el('form');formField(f,'server','رابط الخادم','url',state.settings.server||'https://ram-agent-production.up.railway.app');formField(f,'token','رمز الاتصال (اختياري)','password','');f.append(btn('حفظ الإعدادات',()=>{},'primary'));f.onsubmit=e=>{e.preventDefault();const u=f.elements.server.value.trim();if(!u.startsWith('https://')){toast('استخدم رابط HTTPS');return}const tok=f.elements.token.value;if(tok&&tok.length<24){toast('رمز الاتصال يجب أن يكون 24 حرفًا على الأقل');return}try{if(tok&&!Android.setConnectionToken(tok))throw Error('تعذر حفظ الرمز');state.settings.server=u.replace(/\/+$/,'');save();Android.setServer(state.settings.server);toast('تم حفظ الإعدادات')}catch(err){toast(err.message)}};main.append(f);main.append(el('p','سجل الأعمال محفوظ محليًا على الهاتف. تصدير النسخة الاحتياطية يتم عبر Android.','muted'));main.append(btn('تصدير نسخة احتياطية',()=>Android?.exportData?.()),btn('تفعيل التذكير المحلي',()=>Android?.enableReminders?.()),btn('اختبار الاتصال',()=>Android?.checkCapabilities?.()));}
function go(k){tab=k;render()}function render(){const n=$('nav');n.replaceChildren();for(const [k,t]of Object.entries(tabs))n.append(btn(t,()=>go(k),tab===k?'active':''));const m=$('main');m.replaceChildren();if(tab==='home')summary(m);else{m.append(el('h1',tabs[tab]));if(tab==='opportunities')opportunities(m);if(tab==='active')renderJobs(m,j=>['SELECTED','IN_PROGRESS','DELIVERED','PAYMENT_PENDING','PAYMENT_REPORTED'].includes(j.stage));if(tab==='delivered')renderJobs(m,j=>j.stage==='RECEIVED');if(tab==='dues')dues(m);if(tab==='contacts')contacts(m);if(tab==='legal')legal(m);if(tab==='chat')chat(m);if(tab==='settings')settings(m)}}
$('settingsQuick').onclick=()=>go('settings');render();
</script>
</body></html>
