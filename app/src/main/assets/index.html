<header><div><h1>RAM / رام</h1><small>إنجاز القابضة · إدارة العمل والتحصيل</small></div><button class="orb" id="orb" aria-label="تحدث مع رام" title="تحدث مع رام">🎙</button></header><div id="boot-error" hidden role="alert" style="margin:18px;padding:16px;border:1px solid #ff7272;border-radius:14px;color:#ffdede;background:#421e29"></div><script>window.ramBooted=false;window.addEventListener('error',function(e){if(window.ramBooted)return;var box=document.getElementById('boot-error');if(!box)return;var file=e.target&&e.target.src?e.target.src.split('/').pop():'';box.textContent=e.message?('توقف تشغيل واجهة رام: '+e.message):(file?('تعذر تحميل ملف الواجهة '+file):'حدث خطأ أثناء تحميل واجهة رام');box.hidden=false},true);setTimeout(function(){if(window.ramBooted)return;var box=document.getElementById('boot-error');if(box&&!box.textContent){box.textContent='لم تبدأ واجهة رام. تأكد من وجود index.html وcore.js وapp.js داخل app/src/main/assets';box.hidden=false}},4000);</script><nav id="nav"></nav><main id="main"></main><dialog id="modal"></dialog><div id="toast"></div>
