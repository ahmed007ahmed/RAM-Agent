name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore RAM signing keystore
        shell: bash
        env:
          RAM_KEYSTORE_BASE64: ${{ secrets.RAM_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ram-release.jks"
          test -s "$RUNNER_TEMP/ram-release.jks"

      - name: Build signed release APK
        env:
          RAM_KEYSTORE_FILE: ${{ runner.temp }}/ram-release.jks
          RAM_KEY_ALIAS: ${{ secrets.RAM_KEY_ALIAS }}
          RAM_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
          RAM_KEY_PASSWORD: ${{ secrets.RAM_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
