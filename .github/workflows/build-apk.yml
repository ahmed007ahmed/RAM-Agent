name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          RAM_BUSINESS_KEYSTORE_BASE64: ${{ secrets.RAM_KEYSTORE_BASE64 }}
          RAM_BUSINESS_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
          RAM_BUSINESS_KEY_ALIAS: ${{ secrets.RAM_KEY_ALIAS }}
        run: |
          printf '%s' "$RAM_BUSINESS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ram-release.jks"
          test -s "$RUNNER_TEMP/ram-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ram-release.jks" -storepass "$RAM_BUSINESS_KEYSTORE_PASSWORD" -alias "$RAM_BUSINESS_KEY_ALIAS" >/dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Sign APK with permanent RAM key
        env:
          RAM_BUSINESS_KEY_ALIAS: ${{ secrets.RAM_KEY_ALIAS }}
          RAM_BUSINESS_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
          RAM_BUSINESS_KEY_PASSWORD: ${{ secrets.RAM_KEY_PASSWORD }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT_APK="app/build/outputs/apk/release/RAM-Business-v1.9.apk"
          test -n "$APKSIGNER"
          test -f "$INPUT_APK"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/ram-release.jks" --ks-key-alias "$RAM_BUSINESS_KEY_ALIAS" --ks-pass env:RAM_BUSINESS_KEYSTORE_PASSWORD --key-pass env:RAM_BUSINESS_KEY_PASSWORD --out "$OUTPUT_APK" "$INPUT_APK"
          "$APKSIGNER" verify --verbose "$OUTPUT_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-BUSINESS-SIGNED-APK
          path: app/build/outputs/apk/release/RAM-Business-v1.9.apk
          if-no-files-found: error
