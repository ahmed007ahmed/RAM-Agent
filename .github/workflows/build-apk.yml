name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare v1.4 build number
        run: |
          sed -i 's/versionCode = 4/versionCode = 5/' app/build.gradle.kts
          sed -i 's/versionName = "1.3"/versionName = "1.4"/' app/build.gradle.kts

      - name: Restore signing keystore
        env:
          RAM_KEYSTORE_BASE64: ${{ secrets.RAM_KEYSTORE_BASE64 }}
          RAM_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
          RAM_KEY_ALIAS: ${{ secrets.RAM_KEY_ALIAS }}
        run: |
          printf '%s' "$RAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ram-release.jks"
          test -s "$RUNNER_TEMP/ram-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ram-release.jks" -storepass "$RAM_KEYSTORE_PASSWORD" -alias "$RAM_KEY_ALIAS" >/dev/null

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Sign APK with permanent RAM key
        env:
          RAM_KEY_ALIAS: ${{ secrets.RAM_KEY_ALIAS }}
          RAM_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
          RAM_KEY_PASSWORD: ${{ secrets.RAM_KEY_PASSWORD }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          INPUT_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT_APK="app/build/outputs/apk/release/RAM-v1.4-signed.apk"
          test -n "$APKSIGNER"
          test -f "$INPUT_APK"
          rm -f "$OUTPUT_APK"

          set +e
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/ram-release.jks"             --ks-key-alias "$RAM_KEY_ALIAS"             --ks-pass env:RAM_KEYSTORE_PASSWORD             --key-pass env:RAM_KEYSTORE_PASSWORD             --out "$OUTPUT_APK" "$INPUT_APK"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            rm -f "$OUTPUT_APK"
            "$APKSIGNER" sign               --ks "$RUNNER_TEMP/ram-release.jks"               --ks-key-alias "$RAM_KEY_ALIAS"               --ks-pass env:RAM_KEYSTORE_PASSWORD               --key-pass env:RAM_KEY_PASSWORD               --out "$OUTPUT_APK" "$INPUT_APK"
          fi

          "$APKSIGNER" verify --verbose "$OUTPUT_APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RAM-SIGNED-APK
          path: app/build/outputs/apk/release/RAM-v1.4-signed.apk
          if-no-files-found: error
