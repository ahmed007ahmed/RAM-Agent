name: Diagnose RAM Signing Key

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signing keystore
        env:
          RAM_BUSINESS_KEYSTORE_BASE64: ${{ secrets.RAM_BUSINESS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RAM_BUSINESS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ram-release.jks"
          if [ ! -s "$RUNNER_TEMP/ram-release.jks" ]; then
            echo "ERROR_STAGE=BASE64_OR_EMPTY_KEYSTORE"
            exit 1
          fi
          echo "BASE64_DECODE=OK"

      - name: Check keystore password
        env:
          RAM_BUSINESS_KEYSTORE_PASSWORD: ${{ secrets.RAM_BUSINESS_KEYSTORE_PASSWORD }}
        run: |
          if keytool -list -keystore "$RUNNER_TEMP/ram-release.jks" -storepass "$RAM_BUSINESS_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "KEYSTORE_PASSWORD=OK"
          else
            echo "ERROR_STAGE=KEYSTORE_PASSWORD"
            exit 1
          fi

      - name: Check alias
        env:
          RAM_BUSINESS_KEYSTORE_PASSWORD: ${{ secrets.RAM_BUSINESS_KEYSTORE_PASSWORD }}
          RAM_BUSINESS_KEY_ALIAS: ${{ secrets.RAM_BUSINESS_KEY_ALIAS }}
        run: |
          if keytool -list -keystore "$RUNNER_TEMP/ram-release.jks" -storepass "$RAM_BUSINESS_KEYSTORE_PASSWORD" -alias "$RAM_BUSINESS_KEY_ALIAS" >/dev/null 2>&1; then
            echo "KEY_ALIAS=OK"
          else
            echo "ERROR_STAGE=KEY_ALIAS"
            exit 1
          fi

      - name: Result
        run: echo "SIGNING_KEYSTORE_BASIC_CHECKS=OK"
